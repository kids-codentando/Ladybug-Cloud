services:
  - type: web
    name: ladybug-cloud
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_USERNAME
        value: Ntando
      - key: ADMIN_PASSWORD
        value: mods
      - key: SESSION_SECRET
        generateValue: true
      - key: FREE_BOT_LIMIT
        value: "1"
      - key: PRO_BOT_LIMIT
        value: "10"
      # Free plan has no persistent disk, so data lives on the ephemeral
      # filesystem and resets on redeploy/sleep. To keep users + sessions
      # permanently, upgrade to plan: starter and uncomment the disk block
      # below, then set DATA_DIR=/var/data and BOT_DIR=/var/data/bots/ladybug.
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: BOT_DIR
        value: /opt/render/project/src/bots/ladybug
    # disk:
    #   name: ladybug-data
    #   mountPath: /var/data
    #   sizeGB: 1
